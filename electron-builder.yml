appId: com.gleam.desktop
productName: 拾光
copyright: 拾光 Gleam — 本地离线工具

directories:
  output: release
  # 图标放在这里：build/icon.svg 是源文件，build/icon.png 由 `pnpm run icon` 生成，
  # electron-builder 再从这张 1024 的 PNG 自动派生出各平台需要的尺寸。
  buildResources: build

# 渲染进程与主进程的代码都已由 electron-vite 打包进 out/，
# 只有主进程运行时 require 的 diff 会作为生产依赖被自动带上。
files:
  - out/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: fixtures
    to: fixtures
    filter:
      - '**/*'
  # 构建期证据（git sha / 测试数 / 完整依赖树）随包发出：
  # B3 的离线自检页从 process.resourcesPath 下的 generated/ 读它。
  # 这个目录是 `pnpm evidence` 生成的。electron-builder 遇到不存在的 from
  # 只打一行 warn 就跳过（app-builder-lib 的 copyFiles），不会让打包失败 ——
  # 所以 package:* 脚本里一律先跑 evidence，否则会安静地发出一个缺证据的包。
  - from: build/generated
    to: generated
    filter:
      - '**/*.json'

asar: true
compression: normal

# No auto-update: publishing is disabled entirely.
publish: null
electronUpdaterCompatibility: '>=0.0.0'

win:
  target:
    - target: nsis
      arch:
        - x64
  # 直接给 .ico，别让 electron-builder 自己从 PNG 转 —— 它内置的 WASM 转换器
  # 在部分机器上会因为分配不到内存而整个打包失败。
  icon: build/icon.ico
  artifactName: Gleam-Setup-${version}-${arch}.${ext}
  legalTrademarks: ''

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 拾光
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.developer-tools
  # 产物名走 ASCII。默认会用 productName（拾光）当文件名，而 GitHub Release
  # 上传资产时会把非 ASCII 字符替换掉，SHA256SUMS.txt 里记的名字就对不上了。
  artifactName: Gleam-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development
  # 同 mac：文件名保持 ASCII，与校验清单一致。
  artifactName: Gleam-${version}-${arch}.${ext}
